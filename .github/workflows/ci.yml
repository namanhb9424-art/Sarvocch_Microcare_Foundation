name: SARVOOCCH CI/CD Quality Pipeline

on:
  push:
    branches: [ main, feature/*, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend & API Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      - name: Lint Code
        run: |
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Syntax & Startup Check
        run: |
          python -c "import app; print('[✓] Flask application and database schema imported cleanly.')"

      - name: Test Synthetic Generator
        run: |
          python scripts/seed_generator.py --profile small --db-path /tmp/test_sarvoocch.db

  flutter-verification:
    name: Flutter Mobile Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: sarvocch_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: sarvocch_app
        run: flutter analyze --no-fatal-infos

      - name: Run User Flow Integration Tests
        working-directory: sarvocch_app
        run: flutter test test/user_flows_test.dart
